<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MS News</title>
  <meta name="description" content="Microsoft 365 and Copilot news from X, YouTube, Reddit and Microsoft blogs, newest first.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='7' height='7' fill='%23f25022'/%3E%3Crect x='9' width='7' height='7' fill='%237fba00'/%3E%3Crect y='9' width='7' height='7' fill='%2300a4ef'/%3E%3Crect x='9' y='9' width='7' height='7' fill='%23ffb900'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top" id="top">
    <div class="wrap">
      <div class="masthead">
        <h1>MS News</h1>
        <div class="masthead-links">
          <button class="status-link" id="sync-button" type="button">Sync code</button>
          <button class="status-link" id="status-button" type="button">Loading…</button>
        </div>
      </div>
      <div class="controls">
        <div class="types-row">
          <div class="types" id="types" role="group" aria-label="Filter by source type"></div>
          <button class="saved-button" id="saved-button" type="button" aria-pressed="false">Saved</button>
        </div>
        <input class="search" id="search" type="search" placeholder="Search" aria-label="Search the news" autocomplete="off">
      </div>
      <div class="topics-filter" id="topics-filter" hidden>
        <button class="topics-toggle" id="topics-toggle" type="button" aria-expanded="false" aria-controls="topics"><span>Technologies: All</span></button>
        <div class="topics" id="topics" role="group" aria-label="Filter by technology"></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="summary" id="summary" aria-live="polite"></p>
    <p class="notice" id="notice" role="status" hidden></p>
    <div id="feed"></div>
    <div id="sentinel" aria-hidden="true"></div>
    <p class="end" id="end" hidden>That's everything here.</p>
  </main>

  <dialog id="status-dialog" aria-labelledby="status-title">
    <div class="dialog-head">
      <h2 id="status-title">Sources</h2>
      <form method="dialog"><button type="submit">Close</button></form>
    </div>
    <p class="dialog-note" id="status-note"></p>
    <div id="status-personal"></div>
    <div id="status-table"></div>
    <p class="dialog-note">X posts come from a public embed that can lag behind the live account or stop for a while.</p>
  </dialog>

  <dialog id="sync-dialog" aria-labelledby="sync-title">
    <div class="dialog-head">
      <h2 id="sync-title">Sync code</h2>
      <form method="dialog"><button type="submit">Close</button></form>
    </div>
    <div id="sync-body"></div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
